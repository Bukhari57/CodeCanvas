<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskForge</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>

  <body>
    <main class="app">
      <h1>TaskForge</h1>
      <p class="tagline">Plan it, track it, forge it done.</p>
      <div id="quoteBox">
        <p id="quoteText">Loading motivational quote...</p>
      </div>

      <section class="stats-section">
        <div class="stat-card">
          <div class="stat-icon total">
            <i class="fa-solid fa-list-check"></i>
          </div>

          <div class="stat-info">
            <h3 id="totalTasks">0</h3>
            <p>Total Tasks</p>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon completed">
            <i class="fa-solid fa-circle-check"></i>
          </div>

          <div class="stat-info">
            <h3 id="completedTasks">0</h3>
            <p>Completed</p>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon active">
            <i class="fa-solid fa-hourglass-half"></i>
          </div>

          <div class="stat-info">
            <h3 id="activeTasks">0</h3>
            <p>Active</p>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon category">
            <i class="fa-solid fa-tags"></i>
          </div>

          <div class="stat-info">
            <h3 id="categoryCount">0</h3>
            <p>Categories</p>
          </div>
        </div>
      </section>
      <div class="top-actions">
        <button id="openAddTaskBtn" class="add-task-trigger">
          <i class="fa-solid fa-plus"></i> Add Task
        </button>
      </div>

      <section class="toolbar">
        <div class="search-container">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>

          <input type="text" id="searchInput" placeholder="Search tasks..." />
        </div>

        <select id="filterTask">
          <option value="all">All Tasks</option>
          <option value="active">Active</option>
          <option value="completed">Completed</option>
        </select>

        <select id="sortTask">
          <option value="default">Sort By</option>
          <option value="date">Due Date</option>
          <option value="priority">Priority</option>
        </select>
      </section>

      <section class="task-section">
        <h2>Task List</h2>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Task</th>
                <th>Due Date</th>
                <th>Priority</th>
                <th>Category</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>

            <tbody id="taskList"></tbody>
          </table>
        </div>
      </section>
    </main>

    <div id="taskModal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="taskModalTitle">Add Task</h3>

          <button id="closeTaskModalBtn" class="icon-close-btn" title="Close">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <p id="tagline2">Plan it, track it, forge it done.</p>

        <section class="task-input">
          <div class="task-input-header">
            <label for="taskInput">Task</label>
            <span id="charCount">0 / 200</span>
          </div>
          <textarea
            id="taskInput"
            maxlength="200"
            placeholder="Enter your task..."
            rows="2"
          ></textarea>

          <div class="task-details">
            <div class="field">
              <label for="dueDate">Due Date</label>
              <input type="date" id="dueDate" />
            </div>

            <div class="field">
              <label for="category">Category</label>
              <select id="category">
                <option value="Study">Study</option>
                <option value="Work">Work</option>
                <option value="Personal">Personal</option>
                <option value="Shopping">Shopping</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label>Priority</label>
            <div class="segmented" id="prioritySegmented">
              <button type="button" class="seg-btn" data-value="High">
                High
              </button>
              <button type="button" class="seg-btn" data-value="Medium">
                Medium
              </button>
              <button type="button" class="seg-btn" data-value="Low">
                Low
              </button>
            </div>
            <input type="hidden" id="priority" value="Medium" />
          </div>

          <p id="errorMessage"></p>

          <div class="modal-actions">
            <button id="cancelTaskBtn" class="cancel-btn">Cancel</button>
            <button id="addTaskBtn" class="confirm-btn">Add Task</button>
          </div>
        </section>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
